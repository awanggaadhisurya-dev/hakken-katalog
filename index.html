<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Produk - PT. Hakken Seiko Indonesia</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <!-- Memuat Tailwind CSS untuk styling cepat -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-6">

    <div class="max-w-6xl mx-auto">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold text-blue-900 mb-2">Katalog PT. Hakken Seiko Indonesia</h1>
            <p class="text-gray-600">Menampilkan produk dari file JSON</p>
        </div>

        <!-- Wadah untuk memunculkan Info Card -->
        <div id="product-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Teks loading sementara sebelum data JSON selesai dimuat -->
            <p id="loading-text" class="text-center col-span-full text-gray-500">Memuat produk...</p>
        </div>
    </div>

    <script>
        // Mengambil elemen wadah dari HTML
        const container = document.getElementById('product-container');
        const loadingText = document.getElementById('loading-text');

        // Fungsi untuk mengambil dan menampilkan data dari JSON
        async function loadProducts() {
            try {
                // Mengambil file products.json (pastikan nama file sama persis)
             const response = await fetch('products.json');
const data = await response.json();
const products = data.items; // Menargetkan array di dalam "items"

                // Hapus teks loading
                loadingText.remove();

                // Looping/mengulang pembuatan card untuk setiap produk di JSON
                products.forEach(item => {
                    const cardHTML = `
                        <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition-shadow duration-300">
                            <!-- Foto Produk -->
                            <img src="${item.link_cloudinary}" alt="${item.nama_card}" class="w-full h-48 object-cover">
                            
                            <div class="p-5">
                                <!-- Kategori (Badge) -->
                                <span class="inline-block px-3 py-1 bg-blue-100 text-blue-800 text-xs font-semibold rounded-full mb-3 uppercase tracking-wider">
                                    ${item.kategori}
                                </span>
                                
                                <!-- Nama Produk -->
                                <h3 class="text-xl font-bold text-gray-900 mb-2">${item.nama_card}</h3>
                                
                                <!-- Deskripsi -->
                                <p class="text-gray-600 text-sm mb-4 line-clamp-3">
                                    ${item.deskripsi}
                                </p>
                                
                                <!-- Tombol Pesan (Opsional) -->
                                <a href="https://wa.me/6281234567890?text=Halo,%20saya%20tertarik%20dengan%20${encodeURIComponent(item.nama_card)}" target="_blank" class="block w-full text-center bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition-colors">
                                    Tanya via WhatsApp
                                </a>
                            </div>
                        </div>
                    `;
                    // Menyuntikkan card ke dalam wadah HTML
                    container.innerHTML += cardHTML;
                });

            } catch (error) {
                console.error("Gagal memuat produk:", error);
                loadingText.innerText = "Gagal memuat katalog produk. Periksa koneksi atau file JSON Anda.";
            }
        }

        // Menjalankan fungsi saat web dibuka
        loadProducts();
    </script>
</body>
</html>
